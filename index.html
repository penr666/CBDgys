<!DOCTYPE html>
<html lang="zh-CN" dir="ltr" style="--success: hsl(144 57% 58%); --primary: hsl(259 75% 61%); --destructive: hsl(348 100% 61%); --warning: hsl(42 84% 61%); --font-family: -apple-system, blinkmacsystemfont, 'Segoe UI', roboto, 'Helvetica Neue', arial, 'Noto Sans', sans-serif; --background: 0 0% 100%; --background-deep: 216 20.11% 95.47%; --foreground: 210 6% 21%; --card: 0 0% 100%; --border: 240 5.9% 90%; --radius: 0.5rem; --sidebar: 0 0% 100%; --header: 0 0% 100%;">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="never">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=0">
  <title>CBD供应商</title>
  <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏪</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: hsl(259 75% 61%);
      --primary-light: hsl(259 75% 70%);
      --primary-dark: hsl(259 75% 50%);
      --success: hsl(144 57% 58%);
      --warning: hsl(42 84% 61%);
      --danger: hsl(348 100% 61%);
      --bg-page: hsl(216 20.11% 95.47%);
      --bg-white: #fff;
      --text-primary: #333;
      --text-regular: #666;
      --text-secondary: #999;
      --text-placeholder: #c0c4cc;
      --border-color: hsl(240 5.9% 90%);
      --border-light: #f0f0f0;
      --font-size-base: 14px;
      --font-size-sm: 12px;
      --font-size-lg: 16px;
      --radius: 6px;
      --shadow-sm: 0 1px 4px rgba(0,0,0,0.08);
      --shadow-md: 0 2px 12px rgba(0,0,0,0.1);
      --sidebar-width-icon: 100px;
      --sidebar-width-sub: 170px;
      --header-height: 50px;
    }
    html, body { height: 100%; font-family: var(--font-family); font-size: var(--font-size-base); color: var(--text-primary); background: var(--bg-page); }
    input, button, select, textarea { font-family: inherit; font-size: inherit; }
    a { color: var(--primary); text-decoration: none; }

    /* ============ MAIN LAYOUT ============ */
    .app-layout { display: flex; height: 100vh; width: 100%; overflow: hidden; }
    .app-aside {
      width: calc(var(--sidebar-width-icon) + var(--sidebar-width-sub));
      display: flex; height: 100%; flex-shrink: 0; background: #fff; border-right: 1px solid var(--border-color);
    }
    .sidebar-icon {
      width: var(--sidebar-width-icon); height: 100%; display: flex; flex-direction: column;
      align-items: center; background: #fff; overflow-y: auto; padding-bottom: 20px;
    }
    .sidebar-icon::-webkit-scrollbar { display: none; }
    .sidebar-logo {
      width: 38px; height: 38px; margin: 10px auto 8px; display: flex; align-items: center; justify-content: center;
      background: var(--primary); border-radius: 8px; color: #fff; font-weight: 700; font-size: 14px; letter-spacing: 1px;
    }
    .sidebar-menu { width: 100%; padding: 0 4px; margin-top: 8px; flex: 1; }
    .sidebar-menu-item {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 10px 4px; margin: 4px 0; border-radius: 8px; cursor: pointer;
      transition: background 0.2s, color 0.2s; color: var(--text-regular); font-size: 12px; gap: 4px;
    }
    .sidebar-menu-item:hover { background: hsl(240 5% 96%); }
    .sidebar-menu-item.active { background: hsla(259, 75%, 61%, 0.08); color: var(--primary); }
    .sidebar-menu-item.active svg { stroke: var(--primary); }
    .sidebar-menu-item svg { width: 20px; height: 20px; }

    .sidebar-sub {
      width: var(--sidebar-width-sub); height: 100%; display: flex; flex-direction: column;
      border-left: 1px solid var(--border-light); background: #fff; overflow-y: auto;
    }
    .sidebar-sub-header {
      height: 50px; display: flex; align-items: center; padding-left: 18px;
      font-size: 14px; color: var(--text-regular); border-bottom: 1px solid var(--border-light);
    }
    .sidebar-sub-menu { padding: 8px 0; flex: 1; }
    .sidebar-sub-item {
      padding: 10px 18px; cursor: pointer; font-size: 14px; color: var(--text-regular);
      transition: background 0.2s, color 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .sidebar-sub-item:hover { background: hsl(240 5% 96%); color: var(--text-primary); }
    .sidebar-sub-item.active { color: var(--primary); background: hsla(259, 75%, 61%, 0.06); font-weight: 500; }
    .sidebar-sub-item .arrow { margin-left: auto; font-size: 10px; transition: transform 0.2s; }
    .sidebar-sub-item.expanded .arrow { transform: rotate(90deg); }
    .sidebar-sub-children { display: none; }
    .sidebar-sub-children.show { display: block; }
    .sidebar-sub-child {
      padding: 8px 18px 8px 32px; cursor: pointer; font-size: 13px; color: var(--text-regular);
      transition: background 0.2s, color 0.2s;
    }
    .sidebar-sub-child:hover { background: hsl(240 5% 96%); color: var(--text-primary); }
    .sidebar-sub-child.active { color: var(--primary); }

    /* ============ MAIN CONTENT ============ */
    .app-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .app-header {
      height: var(--header-height); background: #fff; display: flex; align-items: center;
      justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--border-light);
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .header-right { display: flex; align-items: center; gap: 2px; padding: 0 12px; }
    .header-search {
      display: flex; align-items: center; gap: 8px; padding: 5px 12px;
      background: hsl(240 5% 96%); border-radius: 12px; cursor: pointer;
      border: 1px solid hsl(240 5% 92%); transition: border-color 0.2s; font-size: 13px; color: var(--text-regular);
    }
    .header-search:hover { border-color: hsl(240 5% 85%); }
    .header-search kbd {
      padding: 2px 8px; background: #fff; border-radius: 4px 8px 8px 4px;
      font-size: 12px; color: var(--text-secondary); font-family: inherit; font-weight: 500;
    }
    .header-search svg { width: 14px; height: 14px; }
    .header-divider { width: 1px; height: 20px; background: var(--border-light); margin: 0 4px; }
    .header-lang {
      display: flex; align-items: center; gap: 4px; padding: 6px 12px; border: none; background: none;
      cursor: pointer; color: var(--text-regular); font-size: 13px; border-radius: 6px; transition: background 0.2s;
    }
    .header-lang:hover { background: hsl(240 5% 96%); }
    .header-lang svg { width: 16px; height: 16px; }
    .header-user {
      display: flex; align-items: center; gap: 6px; padding: 4px 12px; border: none; background: none;
      cursor: pointer; color: var(--text-regular); font-size: 13px; border-radius: 6px; transition: background 0.2s;
    }
    .header-user:hover { background: hsl(240 5% 96%); }
    .header-avatar {
      width: 28px; height: 28px; border-radius: 50%; background: hsl(240 5% 85%);
      display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; font-weight: 500;
    }
    .header-sys {
      display: flex; align-items: center; gap: 4px; padding: 6px 12px; border: none; background: none;
      cursor: pointer; color: var(--text-regular); font-size: 13px; border-radius: 6px; transition: background 0.2s;
    }
    .header-sys:hover { background: hsl(240 5% 96%); }
    .header-sys svg { width: 16px; height: 16px; }

    .app-content {
      flex: 1; padding: 16px; background: var(--bg-page); overflow-y: auto;
    }
    .page-card {
      background: #fff; border-radius: var(--radius); min-height: calc(100vh - var(--header-height) - 32px);
      display: flex; flex-direction: column;
    }

    /* Filter form */
    .filter-form {
      padding: 16px 16px 0; background: hsl(240 4.8% 96.8%); border-radius: var(--radius) var(--radius) 0 0;
    }
    .filter-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    .filter-item { display: flex; flex-direction: column; gap: 6px; }
    .filter-item label { font-size: 12px; color: var(--text-regular); }
    .filter-item input, .filter-item select {
      height: 32px; border: 1px solid var(--border-color); border-radius: 4px; padding: 0 12px;
      font-size: 13px; color: var(--text-primary); outline: none; min-width: 180px;
      transition: border-color 0.2s;
    }
    .filter-item input:focus, .filter-item select:focus { border-color: var(--primary); }
    .filter-item input::placeholder { color: var(--text-placeholder); }
    .filter-actions { display: flex; gap: 8px; margin-top: 12px; padding-bottom: 16px; }
    .btn {
      display: inline-flex; align-items: center; gap: 4px; padding: 8px 16px; border-radius: 4px;
      font-size: 13px; cursor: pointer; border: 1px solid var(--border-color); background: #fff;
      color: var(--text-primary); transition: all 0.2s; font-weight: 500;
    }
    .btn:hover { border-color: var(--primary); color: var(--primary); }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
    .btn-success { background: var(--success); color: #fff; border-color: var(--success); }
    .btn-danger { color: var(--danger); border-color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn-text { border: none; background: none; color: var(--primary); padding: 4px 8px; }
    .btn-text:hover { background: hsla(259, 75%, 61%, 0.06); }
    .btn-sm { padding: 5px 12px; font-size: 12px; }
    .btn svg { width: 14px; height: 14px; }

    /* Tabs */
    .page-tabs {
      display: flex; border-bottom: 1px solid var(--border-light); padding: 0 16px; background: #fff;
    }
    .page-tab {
      padding: 10px 16px; cursor: pointer; font-size: 14px; color: var(--text-regular);
      border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap;
    }
    .page-tab:hover { color: var(--text-primary); }
    .page-tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 500; }

    /* Table */
    .page-table-wrap { flex: 1; padding: 0; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table th {
      background: hsl(240 4.8% 96.8%); padding: 10px 12px; text-align: left;
      font-weight: 500; color: var(--text-regular); border-bottom: 1px solid var(--border-light);
      white-space: nowrap;
    }
    .data-table td {
      padding: 10px 12px; border-bottom: 1px solid var(--border-light); color: var(--text-primary);
      vertical-align: middle;
    }
    .data-table tr:hover td { background: hsl(240 4.8% 98.5%); }
    .data-table .checkbox { width: 16px; height: 16px; cursor: pointer; }
    .table-empty { text-align: center; padding: 60px 0; color: var(--text-secondary); font-size: 14px; }

    /* Pagination */
    .page-pagination {
      display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;
      border-top: 1px solid var(--border-light); font-size: 13px; color: var(--text-regular);
    }
    .pagination-right { display: flex; align-items: center; gap: 8px; }
    .pagination-right select {
      height: 28px; border: 1px solid var(--border-color); border-radius: 4px; padding: 0 8px;
      font-size: 12px; outline: none;
    }
    .page-btn {
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer; background: #fff;
      transition: all 0.2s; font-size: 12px;
    }
    .page-btn:hover { border-color: var(--primary); color: var(--primary); }
    .page-btn.disabled { opacity: 0.5; cursor: not-allowed; }
    .page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .page-goto { display: flex; align-items: center; gap: 4px; }
    .page-goto input {
      width: 40px; height: 28px; border: 1px solid var(--border-color); border-radius: 4px;
      text-align: center; font-size: 12px; outline: none;
    }

    /* Alert */
    .alert {
      display: flex; align-items: flex-start; gap: 8px; padding: 10px 16px; margin: 12px 16px 0;
      border-radius: 4px; font-size: 13px; background: hsl(42 84% 97%); color: var(--text-regular);
      border: 1px solid hsl(42 84% 90%);
    }
    .alert-icon { color: var(--warning); flex-shrink: 0; margin-top: 1px; }
    .alert-close { margin-left: auto; cursor: pointer; color: var(--text-secondary); padding: 0 4px; }

    /* Stats cards */
    .stats-row { display: flex; gap: 16px; padding: 16px; }
    .stat-card {
      flex: 1; padding: 16px 20px; border-radius: var(--radius); background: #fff;
      border: 1px solid var(--border-light); display: flex; align-items: center; gap: 12px;
    }
    .stat-icon { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .stat-icon.pending { background: hsla(42, 84%, 61%, 0.1); color: var(--warning); }
    .stat-icon.done { background: hsla(144, 57%, 58%, 0.1); color: var(--success); }
    .stat-info { display: flex; flex-direction: column; }
    .stat-label { font-size: 12px; color: var(--text-secondary); }
    .stat-value { font-size: 24px; font-weight: 600; color: var(--text-primary); }

    /* Sub-tabs */
    .sub-tabs { display: flex; gap: 0; padding: 0 16px; border-bottom: 1px solid var(--border-light); }
    .sub-tab {
      padding: 8px 16px; cursor: pointer; font-size: 13px; color: var(--text-regular);
      border-bottom: 2px solid transparent; transition: all 0.2s;
    }
    .sub-tab:hover { color: var(--text-primary); }
    .sub-tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 500; }

    /* Dropdown */
    .dropdown { position: relative; display: inline-block; }
    .dropdown-menu {
      position: absolute; top: 100%; right: 0; background: #fff; border: 1px solid var(--border-light);
      border-radius: var(--radius); box-shadow: var(--shadow-md); min-width: 140px; z-index: 100;
      display: none; padding: 4px 0;
    }
    .dropdown-menu.show { display: block; }
    .dropdown-item {
      padding: 8px 16px; cursor: pointer; font-size: 13px; color: var(--text-regular);
      transition: background 0.15s;
    }
    .dropdown-item:hover { background: hsl(240 5% 96%); color: var(--text-primary); }
    .dropdown-item.danger { color: var(--danger); }

    /* Dialog / Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.45);
      display: none; align-items: flex-start; justify-content: center; z-index: 1000; padding-top: 15vh;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-md);
      width: 600px; max-width: 90vw; max-height: 70vh; overflow: hidden; display: flex; flex-direction: column;
    }
    .modal-header {
      padding: 16px 20px; border-bottom: 1px solid var(--border-light); font-size: 16px; font-weight: 500;
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-close { cursor: pointer; font-size: 18px; color: var(--text-secondary); padding: 4px; }
    .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
    .modal-footer { padding: 12px 20px; border-top: 1px solid var(--border-light); display: flex; justify-content: flex-end; gap: 8px; }

    /* Tags */
    .tag {
      display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px;
      font-size: 12px; font-weight: 500;
    }
    .tag-success { background: hsla(144, 57%, 58%, 0.1); color: var(--success); }
    .tag-warning { background: hsla(42, 84%, 61%, 0.1); color: var(--warning); }
    .tag-danger { background: hsla(348, 100%, 61%, 0.1); color: var(--danger); }
    .tag-info { background: hsl(240 5% 96%); color: var(--text-regular); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(144, 146, 152, 0.3); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(144, 146, 152, 0.5); }
    ::-webkit-scrollbar-track { background: transparent; }

    /* Toast */
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      padding: 12px 20px; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-md);
      display: flex; align-items: center; gap: 8px; font-size: 14px; min-width: 280px;
      animation: slideIn 0.3s ease;
    }
    .toast.success .toast-icon { color: var(--success); }
    .toast.error .toast-icon { color: var(--danger); }
    .toast.warning .toast-icon { color: var(--warning); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* Search modal */
    .search-modal .modal { width: 600px; }
    .search-input-wrap {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      background: #fff; border-bottom: 1px solid var(--border-light);
    }
    .search-input-wrap svg { width: 16px; height: 16px; color: var(--text-placeholder); flex-shrink: 0; }
    .search-input-wrap input {
      flex: 1; border: none; outline: none; font-size: 14px; padding: 4px 0;
    }
    .search-results { padding: 8px 0; max-height: 300px; overflow-y: auto; }
    .search-result-item {
      padding: 8px 16px; cursor: pointer; font-size: 13px; color: var(--text-regular);
      display: flex; align-items: center; gap: 8px; transition: background 0.15s;
    }
    .search-result-item:hover { background: hsl(240 5% 96%); }
    .search-result-item svg { width: 14px; height: 14px; color: var(--text-secondary); }

    /* Footer */
    .page-footer {
      padding: 12px 16px; text-align: center; color: var(--text-secondary); font-size: 12px;
      display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .page-footer a { color: var(--text-secondary); display: inline-flex; align-items: center; gap: 2px; }

    /* Transition */
    .fade-enter { animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Supplier registration page */
    .reg-steps { display: flex; justify-content: center; padding: 24px; gap: 0; }
    .reg-step {
      display: flex; align-items: center; gap: 8px; padding: 8px 16px; font-size: 14px; color: var(--text-secondary);
    }
    .reg-step.active { color: var(--primary); font-weight: 500; }
    .reg-step.done { color: var(--success); }
    .reg-step-num {
      width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 12px; border: 2px solid var(--border-color); color: var(--text-secondary);
    }
    .reg-step.active .reg-step-num { border-color: var(--primary); color: var(--primary); }
    .reg-step.done .reg-step-num { border-color: var(--success); background: var(--success); color: #fff; }
    .reg-step-line { width: 60px; height: 2px; background: var(--border-color); margin: 0 4px; }
    .reg-step.done + .reg-step-line, .reg-step-line.done { background: var(--success); }
  </style>
</head>
<body>
  <div id="app">
    <!-- MAIN LAYOUT -->
    <div class="app-layout" id="mainLayout">
      <!-- Sidebar -->
      <aside class="app-aside">
        <div class="sidebar-icon">
          <div class="sidebar-logo">CBD</div>
          <div class="sidebar-menu">
            <div class="sidebar-menu-item active" data-menu="product" onclick="switchMenu('product', this)">
              <svg viewBox="0 0 48 48" fill="none" stroke="#333" stroke-width="4" stroke-linejoin="round"><path d="M9.78 9.75C9.91 8.75 10.76 8 11.77 8H36.23C37.24 8 38.09 8.75 38.22 9.75L41.72 37.75C41.87 38.95 40.94 40 39.73 40H8.27C7.06 40 6.13 38.95 6.28 37.75L9.78 9.75Z"/><path d="M15 18C15 18 17 22 24 22C31 22 33 18 33 18" stroke-linecap="round"/></svg>
              <span>商品</span>
            </div>
            <div class="sidebar-menu-item" data-menu="trade" onclick="switchMenu('trade', this)">
              <svg viewBox="0 0 48 48" fill="none" stroke="#333" stroke-width="4" stroke-linejoin="round"><path d="M33.05 7H38C39.1 7 40 7.9 40 9V42C40 43.1 39.1 44 38 44H10C8.9 44 8 43.1 8 42V9C8 7.9 8.9 7 10 7H16H17V10H31V7H33.05Z"/><rect x="17" y="4" width="14" height="6" stroke-linecap="round"/><path d="M27 19L19 27H29L21 35" stroke-linecap="round"/></svg>
              <span>交易</span>
            </div>
            <div class="sidebar-menu-item" data-menu="setting" onclick="switchMenu('setting', this)">
              <svg viewBox="0 0 48 48" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M41.5 10H35.5M27.5 6V14M27.5 10H5.5M13.5 24H5.5M21.5 20V28M43.5 24H21.5M41.5 38H35.5M27.5 34V42M27.5 38H5.5"/></svg>
              <span>设置</span>
            </div>
            <div class="sidebar-menu-item" data-menu="finance" onclick="switchMenu('finance', this)">
              <svg viewBox="0 0 48 48" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="14" cy="10" rx="10" ry="5"/><path d="M4 10C4 10 4 14.24 4 17C4 19.76 8.48 22 14 22C19.52 22 24 19.76 24 17C24 15.36 24 10 24 10"/><path d="M4 17C4 17 4 21.24 4 24C4 26.76 8.48 29 14 29C19.52 29 24 26.76 24 24C24 22.36 24 17 24 17"/><path d="M4 24C4 24 4 28.24 4 31C4 33.76 8.48 36 14 36C19.52 36 24 33.76 24 31C24 29.36 24 24 24 24"/><path d="M4 31C4 31 4 35.24 4 38C4 40.76 8.48 43 14 43C19.52 43 24 40.76 24 38C24 36.36 24 31 24 31"/><ellipse cx="34" cy="24" rx="10" ry="5"/><path d="M24 24C24 24 24 28.24 24 31C24 33.76 28.48 36 34 36C39.52 36 44 33.76 44 31C44 29.36 44 24 44 24"/><path d="M24 31C24 31 24 35.24 24 38C24 40.76 28.48 43 34 43C39.52 43 44 40.76 44 38C44 36.36 44 31 44 31"/></svg>
              <span>财务</span>
            </div>
          </div>
        </div>
        <div class="sidebar-sub">
          <div class="sidebar-sub-header" id="subMenuTitle">商品</div>
          <div class="sidebar-sub-menu" id="subMenuList"></div>
        </div>
      </aside>

// ==================== LOGIN (removed, direct entry) ====================
function doLogout() {
  closeUserMenu();

// ==================== MENU ====================
function switchMenu(menuKey, el) {
  currentMenu = menuKey;
  document.querySelectorAll('.sidebar-menu-item').forEach(i => i.classList.remove('active'));
  if (el) el.classList.add('active');
  renderSubMenu(menuKey);
  const firstChild = menuData[menuKey].children[0];
  if (firstChild.children) {
    renderPage(firstChild.children[0].id);
  } else {
    renderPage(firstChild.id);
  }
}

function renderSubMenu(menuKey) {
  const data = menuData[menuKey];
  document.getElementById('subMenuTitle').textContent = data.title;
  const list = document.getElementById('subMenuList');
  let html = '';
  data.children.forEach(item => {
    if (item.children) {
      html += `<div class="sidebar-sub-item expanded" onclick="toggleSubExpand(this)" data-id="${item.id}">
        <span>${item.label}</span><span class="arrow">›</span>
      </div>
      <div class="sidebar-sub-children show">
        ${item.children.map(c => `<div class="sidebar-sub-child${c.id === currentSubPage ? ' active' : ''}" data-id="${c.id}" onclick="selectSubPage('${c.id}', this)">${c.label}</div>`).join('')}
      </div>`;
    } else {
      html += `<div class="sidebar-sub-item${item.id === currentSubPage ? ' active' : ''}" data-id="${item.id}" onclick="selectSubPage('${item.id}', this)">${item.label}</div>`;
    }
  });
  list.innerHTML = html;
}

function toggleSubExpand(el) {
  el.classList.toggle('expanded');
  const sibling = el.nextElementSibling;
  if (sibling && sibling.classList.contains('sidebar-sub-children')) {
    sibling.classList.toggle('show');
  }
}

function selectSubPage(pageId, el) {
  currentSubPage = pageId;
  currentPage = 1;
  document.querySelectorAll('.sidebar-sub-item, .sidebar-sub-child').forEach(i => i.classList.remove('active'));
  if (el) el.classList.add('active');
  renderPage(pageId);
}

// ==================== PAGE RENDERING ====================
function renderPage(pageId) {
  currentSubPage = pageId;
  const content = document.getElementById('pageContent');
  const pageRenderers = {
    'product-manage': renderProductManage,
    'material-manage': renderMaterialManage,
    'order-list': renderOrderList,

    'export-list': renderExportList,
    'desensitize-data': renderDesensitizeData,
    'supplier-register': renderSupplierRegister,
    'settlement-summary': renderSettlementSummary
  };
  const renderer = pageRenderers[pageId];
  if (renderer) {
    content.innerHTML = `<div class="page-card fade-enter">${renderer()}</div>`;
  }
}

// ==================== INTERACTIONS ====================
function toggleLang() {
  const el = document.getElementById('headerLangText');
  if (el) {
    el.textContent = el.textContent === 'English' ? '中文' : 'English';
  }
}

function toggleUserMenu() {
  const menu = document.getElementById('userMenu');
  menu.classList.toggle('show');
}

function closeUserMenu() {
  document.getElementById('userMenu').classList.remove('show');
}

document.addEventListener('click', function(e) {
  const userBtn = document.querySelector('.header-user');
  const userMenu = document.getElementById('userMenu');
  if (userBtn && userMenu && !userBtn.contains(e.target) && !userMenu.contains(e.target)) {
    userMenu.classList.remove('show');
  }
  // Close dropdown menus
  document.querySelectorAll('.dropdown-menu.show').forEach(m => {
    if (!m.parentElement.contains(e.target)) m.classList.remove('show');
  });
});

function showToast(type, message) {
  const container = document.getElementById('toastContainer');
  const icons = { success: '✓', error: '✕', warning: '⚠' };
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span class="toast-icon">${icons[type] || '✓'}</span><span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(100%)'; toast.style.transition = 'all 0.3s'; }, 2500);
  setTimeout(() => toast.remove(), 2800);
}

function switchTab(el) {
  el.parentElement.querySelectorAll('.page-tab, .sub-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

function switchSubTab(el) {
  el.parentElement.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

function openSearch() {
  document.getElementById('searchModal').classList.add('show');
  const input = document.getElementById('searchInput');
  input.value = '';
  input.focus();
  renderSearchResults('');
}

function closeSearch() {
  document.getElementById('searchModal').classList.remove('show');
}

function renderSearchResults(query) {
  const results = document.getElementById('searchResults');
  const allPages = [];
  for (const key in menuData) {
    menuData[key].children.forEach(item => {
      if (item.children) {
        item.children.forEach(c => allPages.push({ id: c.id, label: c.label, parent: item.label }));
      } else {
        allPages.push({ id: item.id, label: item.label, parent: menuData[key].title });
      }
    });
  }
  const filtered = query ? allPages.filter(p => p.label.includes(query) || p.parent.includes(query)) : allPages;
  results.innerHTML = filtered.map(p => `
    <div class="search-result-item" onclick="jumpToPage('${p.id}')">
      <svg viewBox="0 0 48 48" width="14" height="14" fill="none" stroke="currentColor" stroke-width="4"><circle cx="21" cy="21" r="17"/><path d="M33.22 33.22L41.71 41.71" stroke-linecap="round"/></svg>
      <span>${p.parent} / ${p.label}</span>
    </div>
  `).join('');
}

function filterSearch() {
  renderSearchResults(document.getElementById('searchInput').value);
}

function jumpToPage(pageId) {
  closeSearch();
  // Find the menu key for this page
  for (const key in menuData) {
    const found = menuData[key].children.find(item => {
      if (item.id === pageId) return true;
      if (item.children) return item.children.find(c => c.id === pageId);
      return false;
    });
    if (found) {
      // Switch to the correct main menu
      const menuEl = document.querySelector(`.sidebar-menu-item[data-menu="${key}"]`);
      if (menuEl) switchMenu(key, menuEl);
      // Select the sub page
      setTimeout(() => {
        const subEl = document.querySelector(`.sidebar-sub-item[data-id="${pageId}"], .sidebar-sub-child[data-id="${pageId}"]`);
        if (subEl) selectSubPage(pageId, subEl);
      }, 50);
      break;
    }
  }
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

// Close search modal on overlay click
document.getElementById('searchModal').addEventListener('click', function(e) {
  if (e.target === this) closeSearch();
});
document.getElementById('genericModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal('genericModal');
});

// Keyboard shortcut
document.addEventListener('keydown', function(e) {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    openSearch();
  }
  if (e.key === 'Escape') {
    closeSearch();
    closeModal('genericModal');
  }
});

function showMoreMenu(event) {
  event.stopPropagation();
  // Remove existing more menus
  document.querySelectorAll('.more-dropdown').forEach(m => m.remove());
  const menu = document.createElement('div');
  menu.className = 'dropdown-menu show more-dropdown';
  menu.style.position = 'absolute';
  menu.style.left = event.pageX + 'px';
  menu.style.top = event.pageY + 'px';
  menu.style.zIndex = '999';
  menu.innerHTML = `
    <div class="dropdown-item" onclick="showToast('success','已上架');this.parentElement.remove();">上架</div>
    <div class="dropdown-item" onclick="showToast('success','已下架');this.parentElement.remove();">下架</div>
    <div class="dropdown-item danger" onclick="showToast('success','已删除');this.parentElement.remove();">删除</div>
  `;
  document.body.appendChild(menu);
  setTimeout(() => {
    document.addEventListener('click', function handler() {
      menu.remove();
      document.removeEventListener('click', handler);
    }, { once: true });
  }, 10);
}

// Initialize
document.addEventListener('DOMContentLoaded', function() {
  renderSubMenu('product');
